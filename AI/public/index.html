<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Slide Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f7f6f4;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #ebebeb;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #3D1A2B, #7a3250);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px;
  }
  header h1 { font-size: 16px; font-weight: 700; color: #1a1a1a; }
  header .sub { font-size: 12px; color: #aaa; margin-left: 2px; }

  .container { max-width: 820px; margin: 36px auto; padding: 0 20px; }

  .card {
    background: #fff;
    border: 1px solid #e8e8e8;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: #7a3250;
    margin-bottom: 14px;
  }

  textarea {
    width: 100%;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 14px;
    line-height: 1.65;
    resize: vertical;
    min-height: 150px;
    outline: none;
    transition: border .18s;
    font-family: inherit;
    color: #1a1a1a;
    background: #fafafa;
  }
  textarea:focus { border-color: #7a3250; background: #fff; }
  textarea::placeholder { color: #bbb; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 20px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all .15s;
    white-space: nowrap;
  }
  .btn-primary { background: #3D1A2B; color: #fff; }
  .btn-primary:hover { background: #2e1220; transform: translateY(-1px); }
  .btn-ghost { background: #f0f0f0; color: #444; }
  .btn-ghost:hover { background: #e6e6e6; }
  .btn-green { background: #16a34a; color: #fff; }
  .btn-green:hover { background: #15803d; }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  /* Preview */
  .slide-preview {
    border: 1.5px solid #e8e8e8;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 14px;
    background: #fafafa;
  }
  .preview-header {
    padding: 10px 14px;
    background: #f4f1f2;
    border-bottom: 1px solid #e8e8e8;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .preview-title {
    font-size: 15px;
    font-weight: 700;
    color: #3D1A2B;
  }
  .preview-sub {
    font-size: 12px;
    color: #7a5060;
    font-style: italic;
  }
  .preview-axes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .preview-axis {
    padding: 14px 16px;
    border-right: 1px solid #e8e8e8;
  }
  .preview-axis:last-child { border-right: none; }
  .axis-header {
    font-size: 12px;
    font-weight: 700;
    color: #3D1A2B;
    text-transform: uppercase;
    letter-spacing: .4px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid #3D1A2B;
    display: inline-block;
  }
  .axis-item {
    font-size: 12px;
    color: #475569;
    line-height: 1.55;
    margin-bottom: 4px;
    padding-left: 0;
  }
  .axis-item.bullet {
    padding-left: 14px;
    position: relative;
    color: #3D1A2B;
  }
  .axis-item.bullet::before {
    content: "•";
    position: absolute;
    left: 2px;
    color: #3D1A2B;
  }
  .axis-item .kw { font-weight: 700; }

  /* Download card */
  .ready-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f0faf4;
    border: 1px solid #bbf0d1;
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 4px;
    font-size: 13px;
    color: #14532d;
  }
  .ready-icon { font-size: 20px; }

  .drive-link {
    background: #fff8f0;
    border: 1px solid #fdd8b0;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #7c3400;
    margin-top: 10px;
  }
  .drive-link a { color: #7a3250; font-weight: 600; }

  /* Status */
  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #888;
    margin-top: 14px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; }
  .dot.on { background: #22c55e; }
  .dot.spinning { background: #7a3250; animation: pulse .8s infinite alternate; }

  @keyframes pulse { to { opacity: .3; } }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #991b1b;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 13px;
    margin-top: 10px;
  }

  code {
    background: #f3f3f3;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 12px;
    color: #3D1A2B;
  }

  .setup-step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .step-num {
    min-width: 22px; height: 22px;
    background: #3D1A2B;
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    margin-top: 1px;
  }
  .step-body { font-size: 13px; color: #444; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div class="logo">S</div>
  <h1>Slide Generator</h1>
  <span class="sub">Proof Of concept


  </span>
</header>

<div class="container">

  <!-- INPUT -->
  <div class="card">
    <div class="card-title">Your Text</div>
    <textarea id="inputText" placeholder="Paste or type your content here. Strategy notes, a brief, a report, anything. The AI will structure it into a two-axis slide."></textarea>
    <div class="row">
      <button class="btn btn-primary" id="processBtn" onclick="processText()">
        <span id="processLabel">Analyse with AI</span>
      </button>
      <button class="btn btn-ghost" onclick="document.getElementById('inputText').value=''">Clear</button>
    </div>
    <div id="processError" class="error" style="display:none"></div>
  </div>

  <!-- PREVIEW -->
  <div class="card" id="resultCard" style="display:none">
    <div class="card-title">Preview</div>
    <div id="resultContent"></div>
    <div class="row">
      <button class="btn btn-primary" id="generateBtn" onclick="generatePptx()">
        <span id="genLabel">Generate PPTX</span>
      </button>
    </div>
    <div id="genError" class="error" style="display:none"></div>
  </div>

  <!-- DOWNLOAD -->
  <div class="card" id="downloadCard" style="display:none">
    <div class="card-title">Ready</div>
    <div class="ready-box">
      <span class="ready-icon">&#10003;</span>
      <span>Your slide is ready.</span>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-ghost" id="dlBtn" onclick="downloadFile()">Download .pptx</button>
      <button class="btn btn-green" id="driveBtn" onclick="uploadDrive()">
        <span id="driveLabel">Open in Google Slides</span>
      </button>
    </div>
    <div id="driveResult"></div>
    <div id="driveError" class="error" style="display:none"></div>
  </div>

  
</div>

<script>
let currentContent = null;
let currentFile    = null;
let hasAnalyzed    = false; // ADD THIS

async function processText() {
  const text = document.getElementById("inputText").value.trim();
  if (!text) return;
  const btn = document.getElementById("processBtn");
  const lbl = document.getElementById("processLabel");
  const err = document.getElementById("processError");
  err.style.display = "none";
  btn.disabled = true;
  lbl.innerHTML = '<span class="spinner"></span> Thinking...';

  try {
    const res  = await fetch("/api/process", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text}) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    currentContent = data.content;
    renderPreview(data.content);
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("downloadCard").style.display = "none";
    document.getElementById("resultCard").scrollIntoView({ behavior:"smooth" });
  } catch(e) {
    err.textContent = "Error: " + e.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false;
    lbl.textContent = "Re-analyze";
  }
}

function renderPreview(c) {
  let html = `<div class="slide-preview">`;
  html += `<div class="preview-header">
    <span class="preview-title">${esc(c.title)}</span>
    <span class="preview-sub">${esc(c.shortParagraph)}</span>
  </div>`;
  html += `<div class="preview-axes">`;
  (c.axes || []).forEach(ax => {
    html += `<div class="preview-axis">`;
    html += `<div><span class="axis-header">${esc(ax.header)}</span></div>`;
    (ax.items || []).forEach(item => {
      const cls = item.type === "bullet" ? "axis-item bullet" : "axis-item";
      html += `<div class="${cls}">${highlightKeywords(item.text, ax.keywords || [])}</div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById("resultContent").innerHTML = html;
}

function highlightKeywords(text, keywords) {
  if (!keywords.length) return esc(text);
  const re = new RegExp(`(${keywords.map(k => k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})`, "gi");
  return esc(text).replace(re, '<span class="kw">$1</span>');
}

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function generatePptx() {
  if (!currentContent) return;
  const btn = document.getElementById("generateBtn");
  const lbl = document.getElementById("genLabel");
  const err = document.getElementById("genError");
  err.style.display = "none";
  btn.disabled = true;
  lbl.innerHTML = '<span class="spinner"></span> Building slide...';

  try {
    const res  = await fetch("/api/generate", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({content:currentContent}) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    currentFile = data.file;
    document.getElementById("downloadCard").style.display = "block";
    document.getElementById("downloadCard").scrollIntoView({ behavior:"smooth" });
  } catch(e) {
    err.textContent = "Error: " + e.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false;
    lbl.textContent = "Generate PPTX";
  }
}

function downloadFile() {
  if (currentFile) window.open("/api/download/" + currentFile);
}

async function uploadDrive() {
  if (!currentFile) return;
  const btn = document.getElementById("driveBtn");
  const lbl = document.getElementById("driveLabel");
  const err = document.getElementById("driveError");
  const res2 = document.getElementById("driveResult");
  err.style.display = "none";
  res2.innerHTML = "";
  btn.disabled = true;
  lbl.innerHTML = '<span class="spinner"></span> Uploading...';

  try {
    const res  = await fetch("/api/upload-drive", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({file:currentFile}) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    res2.innerHTML = `<div class="drive-link">Uploaded. <a href="${data.link}" target="_blank">Open in Google Slides</a></div>`;
  } catch(e) {
    err.textContent = e.message.includes("not configured")
      ? "Google Drive not set up yet. See GDRIVE_SETUP.md."
      : "Error: " + e.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false;
    lbl.textContent = "Open in Google Slides";
  }
}

(async () => {
  try {
    const d = await (await fetch("/api/drive-status")).json();
    document.getElementById("driveDot").className = "dot" + (d.connected ? " on" : "");
    document.getElementById("driveStatus").textContent = d.connected
      ? "Google Drive connected"
      : "Google Drive not connected";
  } catch {}
})();
</script>
</body>
</html>
